version: "3.8"
services:
  animora-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: animora_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Animora@2026StrongPass!
      - MSSQL_PID=Developer
      - TZ=UTC
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver_data:
